<text x="623" y="887" font-size="13" font-weight="normal" fill="#3d4756" text-anchor="start">trust-boundary crossing (F4, F5)</text>
<line x1="867" y1="882" x2="899" y2="882" stroke="#a2491f" stroke-width="1.8"/>
<text x="905" y="887" font-size="13" font-weight="normal" fill="#a2491f" text-anchor="start">TB3: to its own wallet&#x27;s internal APIs only</text>
<text x="20" y="908" font-size="13" font-weight="normal" fill="#3d4756" text-anchor="start">Two kinds of wallet: the participant&#x27;s is its W-Stack tenant, which it alone fills by accepting offers (F1); people&#x27;s are in their phone or browser (F2, F3). The federation issues and publishes</text>
<text x="20" y="924" font-size="13" font-weight="normal" fill="#3d4756" text-anchor="start">status lists; it never acts in a participant&#x27;s systems. Keycloak is not on the login path.</text>
