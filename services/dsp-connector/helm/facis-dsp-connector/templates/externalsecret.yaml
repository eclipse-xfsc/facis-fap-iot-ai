{{/*
ExternalSecrets for the Secrets this chart does not render itself (External
Secrets Operator, API external-secrets.io/v1). Each one copies every property
of one key of the secret store into the Secret, so the store key holds the same
keys the chart-rendered Secret would have.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- if .Values.dsp.renderSecret }}
{{- fail "externalSecrets.enabled needs dsp.renderSecret=false: the chart would render the same Secret" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "facis-dsp-connector.fullname" . }}-dsp-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "facis-dsp-connector.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled" .Values.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ include "facis-dsp-connector.fullname" . }}-dsp-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.dspSecrets.remoteKey is required when externalSecrets.enabled" .Values.externalSecrets.dspSecrets.remoteKey }}
{{- end }}
