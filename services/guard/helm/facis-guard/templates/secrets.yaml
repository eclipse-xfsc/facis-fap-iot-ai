{{- /* Secrets rendered from values, unless an existing Secret is named. */}}
{{- $full := include "facis-guard.fullname" . }}
{{- if and .Values.postgres.enabled (not .Values.existingSecrets.postgres) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-postgres
  labels:
    {{- include "facis-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "postgres.password is required (or existingSecrets.postgres)" .Values.postgres.password | quote }}
---
{{- end }}
{{- if not .Values.existingSecrets.hydra }}
{{- if not .Values.postgres.enabled }}
{{- fail "with postgres.enabled=false, put the database dsn in existingSecrets.hydra (keys system-secret, dsn)" }}
{{- end }}
{{- $secret := required "hydra.systemSecret is required (or existingSecrets.hydra)" .Values.hydra.systemSecret }}
{{- if lt (len $secret) 32 }}{{ fail "hydra.systemSecret must be at least 32 characters" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-hydra
  labels:
    {{- include "facis-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  system-secret: {{ $secret | quote }}
  dsn: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.user (.Values.postgres.password | urlquery) $full .Values.postgres.database | quote }}
---
{{- end }}
{{- if not .Values.existingSecrets.loginProvider }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-login
  labels:
    {{- include "facis-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ .Values.loginProvider.adminToken | quote }}
{{- end }}
